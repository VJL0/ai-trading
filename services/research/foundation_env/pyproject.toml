[project]
name = "lat-foundation-research"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "safetensors>=0.6",
  "huggingface-hub>=0.33",
  "chronos-forecasting>=2.2",
  "tirex-2>=0.5",
  "tfc-t0[mlx,torch]>=0.6.1",
  "timesfm>=2.0",
  "tabicl>=2",
  "structured-data-models>=0.2.1",
  "timestral",
  "simons",
  "autogluon-tabular>=1.6",
  "st-moe-pytorch>=0.1.8",
  "einx>=0.3",
]
[tool.uv]
package = false
[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }
simons = { git = "https://github.com/Abel-ai-lab/Simons.git" }
