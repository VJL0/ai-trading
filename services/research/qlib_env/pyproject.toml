# Isolated Microsoft Qlib v0.9.8 research environment (spec §3, fixed selection).
#
# This is a SEPARATE uv project with its own .venv (services/research/qlib_env/.venv). It never
# touches the root project environment. PyPI's newest pyqlib is 0.9.7 (checked 2026-11-05), so
# v0.9.8 is built from the pinned upstream git tag (commit 54355232463878d2eebb91fe0ee5fa7fa1f5976c).
#
#   cd services/research/qlib_env && SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYQLIB=0.9.8 uv sync --python 3.11
[project]
name = "lat-qlib-env"
version = "0.1.0"
description = "Isolated Qlib v0.9.8 environment for local point-in-time research (no trading)"
requires-python = "==3.11.*"
dependencies = [
  "pyqlib==0.9.8",
  "lightgbm>=4.5",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=17",
]

[tool.uv]
package = false

[tool.uv.sources]
pyqlib = { git = "https://github.com/microsoft/qlib", rev = "54355232463878d2eebb91fe0ee5fa7fa1f5976c" }
