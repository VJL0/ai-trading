[mcp_servers.local-ai-trader.tools.cancel_schedule]
approval_mode = "prompt"

[mcp_servers.local-ai-trader.tools.get_capabilities]
approval_mode = "approve"

[mcp_servers.local-ai-trader.tools.get_research_results]
approval_mode = "approve"

[mcp_servers.local-ai-trader.tools.get_opportunities]
approval_mode = "approve"

