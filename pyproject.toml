[project]
name = "local-ai-trader"
version = "0.1.0"
description = "Local-first quantitative + AI paper-trading workstation (LEAN + Alpaca, PAPER by default)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary (local use); third-party components retain their own licenses" }
dependencies = [
  # API backend
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # model framework + provider SDKs
  "pydantic-ai-slim[anthropic,openai]>=1.0",
  "anthropic>=0.60",
  "openai>=1.99",
  # broker / market data (data, account and paper connectivity tests only — never a second order path)
  "alpaca-py>=0.40",
  # analytics
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=1.26",
  "exchange-calendars>=4.5",
  # ML baselines (Qlib lives in its own isolated environment: services/research/qlib_env)
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "catboost>=1.2",
  # secrets
  "keyring>=25",
  "cryptography>=43",
  "mcp>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
kronos = ["torch>=2.5", "einops==0.8.1", "huggingface-hub>=0.33,<1", "safetensors>=0.6.2", "tqdm>=4.67"]
advanced-research = ["torch>=2.5", "xgboost>=2.1", "arch>=7", "hmmlearn>=0.3", "tabm>=0.0.3"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "pyright>=1.1.385",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "services", "apps/mac-agent/mac_agent"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/mac-agent"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra --strict-markers"
markers = [
  "paper_broker: requires real Alpaca PAPER credentials (skipped otherwise); reports must state real paper usage",
  "live_models: requires real Anthropic/OpenAI API keys (skipped otherwise)",
  "lean: requires the locally built LEAN engine",
  "gui: requires macOS GUI permissions (Peekaboo/Playwright)",
  "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning:exchange_calendars.*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["trading/lean/Lean", "trading/alpaca_plugin", ".tools", "services/research/qlib_env", "services/research/foundation_env", "services/research/rd_env", "services/research/kronos/vendor", "services/research/advanced/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "DTZ", "RUF", "PT", "SIM"]
ignore = [
  "S101",   # asserts are fine in tests
  "S603", "S607",  # subprocess with explicit argv lists is intended (peekaboo, dotnet, security)
  "RUF012",
  "B008",   # FastAPI Depends() in defaults
  "PT018",  # compound assertions are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "DTZ001", "PT011"]
"scripts/**" = ["T201"]

[tool.pyright]
pythonVersion = "3.11"
include = ["packages", "services", "apps/mac-agent/mac_agent", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "trading", ".tools", "services/research/qlib_env", "services/research/foundation_env", "services/research/rd_env", ".venv", "services/research/advanced/vendor", "services/research/kronos/vendor"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
strict = ["packages/contracts", "packages/core", "services/risk"]
